name: adopta

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: adopta
      POSTGRES_PASSWORD: adopta
      POSTGRES_DB: adopta
    ports:
      - "5432:5432"
    volumes:
      - adopta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adopta"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgres://adopta:adopta@postgres:5432/adopta
      DATABASE_POOL_MAX: 10
      # Dev-only default so `docker compose up` works out of the box on a
      # clean checkout with no extra setup; override for anything beyond
      # local/demo use (B9 README: never a real secret in source control).
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-please-32chars}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8787}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/.storage
      LOG_LEVEL: info
      SEED_SCENARIO: ${SEED_SCENARIO:-demo}
      SEED_IMAGE_MODE: ${SEED_IMAGE_MODE:-offline}
    ports:
      - "8787:8787"
    volumes:
      - adopta_api_storage:/app/.storage

volumes:
  adopta_postgres_data:
  adopta_api_storage:
